id: SC-M1553-002
title: RT2에서 32워드 읽기 (워드 수 필드 0)
requirements: [REQ-1553-002]
bus: m1553
duration_ms: 100
nodes:
  - name: BC
    schedule: [{ rt: 2, dir: rt_to_bc, sa: 1, wc: 32, period_ms: 25 }]
  - { name: RT2, rt: 2, tx_words: [0xAAAA, 0xBBBB] }
expect:
  - { kind: count, node: BC, rt: 2, tr: 1, sa: 1, min: 4, max: 4 }
  - { kind: status_word, node: BC, rt: 2, tr: 1, sa: 1, bits: { busy: false } }
